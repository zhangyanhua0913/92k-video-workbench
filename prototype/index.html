<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频工作台 · 完整交互设计</title>
<style>
:root{--ink:#192d2a;--muted:#71817b;--line:#dfe7e2;--green:#176d58;--bg:#f3f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}button.active,button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.4;cursor:default}aside{position:fixed;width:220px;inset:0 auto 0 0;background:#142c27;color:white;padding:30px 18px;display:flex;flex-direction:column;z-index:3}.brand{font-size:24px;font-weight:750;padding:0 12px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:#a5beb3;margin-top:3px}nav{margin-top:40px;display:grid;gap:7px}nav button{background:none;border-color:transparent;color:#b7cbc0;text-align:left;padding:12px}nav button.active{background:#2c4c41}aside .bottom{margin-top:auto;color:#a5beb3;font-size:12px;padding:12px}.kicker{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700}main{margin-left:220px;min-height:100vh;padding:24px 40px 110px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}header strong{font-size:16px}header span{font-size:12px;color:var(--muted)}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:21px;margin:0 0 10px}h3{margin:4px 0 10px;font-size:17px}p{margin:8px 0 18px;color:var(--muted)}.pill{font-size:11px;border-radius:20px;background:#e3eee5;color:#356c51;padding:5px 10px;display:inline-block}.amber{background:#fff0d0;color:#9a6b13}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:25px}.mode-card{min-height:230px;display:flex;flex-direction:column}.mode-card p{flex:1}.mode-card .num{font-size:30px;font-weight:800;color:#c2d4c8}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.sub{font-size:12px;color:var(--muted)}.hero{padding:18px 0 24px}.scope{background:#fff8e7;border:1px solid #eddeb7;border-radius:9px;padding:9px 15px;color:#80651f;font-size:12px;margin-bottom:22px}.steps{display:flex;gap:7px;margin-bottom:26px;flex-wrap:wrap}.steps button{font-size:12px;padding:10px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:24px}.summary{position:sticky;top:20px;align-self:start}.summary dl{margin:0}.summary dt{font-size:12px;color:var(--muted);margin-top:20px}.summary dd{margin:4px 0;font-weight:600}.wide{grid-column:1/-1}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fafcf9;margin:8px 0 20px}textarea{height:165px;resize:vertical}label{font-size:13px;font-weight:600}.upload{padding:28px;border:1px dashed #b5c9ba;border-radius:12px;background:#fafcf8;text-align:center}.upload input{background:white;font-size:12px}.style-card{cursor:pointer;position:relative;transition:border .15s}.style-card.selected{border:2px solid var(--green);padding:24px}.style-thumb{height:90px;border-radius:9px;background:#1c2822;color:#f3d382;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;margin-bottom:16px}.sample{background:linear-gradient(130deg,#f4e9ce,#c2d7ca);color:#234937}.stage-list{padding-left:20px}.stage-list li{margin:14px 0}.source{border-left:3px solid #8eb59f;padding-left:16px;margin:20px 0}.film{height:235px;background:#192a25;border-radius:12px;color:#d3e3d7;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;margin:12px 0}.film small{font-size:12px;color:#a5b8ae}.segment{display:flex;gap:8px;margin-top:20px}.segment span{flex:1;background:#c4d7c9;padding:15px 4px;text-align:center;border-radius:5px;font-size:12px}.toolbar{position:fixed;bottom:0;left:220px;right:0;background:#ffffffef;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px 40px;z-index:4}.toast{position:fixed;top:22px;right:25px;background:#173c2e;color:white;padding:12px 20px;border-radius:10px;z-index:10;display:none}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.hidden{display:none!important}details{font-size:12px;color:var(--muted);margin-top:16px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:1100px){aside{width:180px}main{margin-left:180px;padding:20px}.toolbar{left:180px}.workspace{grid-template-columns:1fr}.summary{position:static}.grid{gap:12px}}@media(max-width:700px){aside{position:static;width:auto;padding:15px}nav{margin-top:15px;display:flex;overflow:auto}.brand small,aside .bottom{display:none}main{margin:0;padding:18px 18px 100px}.grid{grid-template-columns:1fr}.toolbar{left:0;padding:12px 18px}h1{font-size:26px}}
</style>
<aside><div class="brand">视频工作台<small>ONE WORKSPACE</small></div><nav id="nav"></nav><div class="bottom">一个项目，一条制作记录。<br>风格可更新，旧项目留原版。<hr class="divider">页面交互设计 · V2<br>不连接生成或付费接口</div></aside><main><header><strong id="crumb">工作台 / 开始创作</strong><div class="row"><span id="version">本地交互原型</span><button id="settings">配置中心</button></div></header><div class="scope">交互设计预览：内容、素材卡和审看状态均为示例；不会搜索、上传、配置 Key 或发起付费任务。</div><div id="body"></div></main><div id="toast" class="toast"></div><div id="toolbar" class="toolbar hidden"></div>
<script src="version.js"></script>
<script>
const modes={talk:{name:'口播视频剪辑',given:'我已经录好了真人口播',out:'剪掉口误与停顿，校字幕，调整节奏和包装。',input:'上传真人口播视频',steps:['导入视频','字幕与粗剪','选择风格 Skill','包装与配乐','成片审看','导出交付'],styles:['clean','fred','gold','free','evidence','footage'],recommended:['clean','fred','gold']},footage:{name:'素材解说成片',given:'我有文案，想找真实画面来讲解',out:'按文案搜网络视频和图片，配旁白、字幕和动效。',input:'输入解说文案',steps:['文案与旁白','选择风格 Skill','分镜与素材需求','搜集与选择素材','成片审看','导出交付'],styles:['footage','free'],recommended:['footage']},generate:{name:'AI 视频生成',given:'我想生成新的画面或数字人',out:'按分镜生成图片、视频、数字人口播，并合成。',input:'输入主题或拍摄脚本',steps:['脚本与分镜','选择制作 Skill','人物与声音','模型与预算','素材及成片审看','导出交付'],styles:['director'],recommended:['director']},hybrid:{name:'真人混搭成片',given:'我有真人视频，还想穿插资料和演示',out:'保留真人表达，加入视频素材、截图、图表和动效。',input:'导入真人视频与参考资料',steps:['真人视频与资料','字幕与剪辑','选择风格 Skill','资料与画面映射','混搭成片审看','导出交付'],styles:['evidence','footage','free','gold','fred','clean'],recommended:['evidence','footage','free']}};
const styles={clean:{name:'自然口播 / 无包装',skill:'talking-edit · none',desc:'保留人物与原声，完成剪辑和字幕。',state:'本地执行'},fred:{name:'FredTalk 动态包装',skill:'fredtalk-motion',desc:'按语义安排标题、说明与视觉组件。',state:'Agent 制作'},gold:{name:'暗金科技',skill:'remotion-gold',desc:'金黑标题、重点强调与科技感动效。',state:'模板 / Agent'},free:{name:'自由创意',skill:'remotion-plugin',desc:'根据本期内容独立设计动画与构图。',state:'Agent 制作'},evidence:{name:'资料讲解与人物同屏',skill:'remotion-evidence',desc:'人物与资料窗、图表、流程交替讲解。',state:'Agent 制作'},footage:{name:'网络素材解说',skill:'narration-footage',desc:'按文案搜索素材，检查版本、选段并融合动效。',state:'Agent 制作'},director:{name:'脚本分镜成片',skill:'92k-video-director',desc:'图片、视频、数字人、配音接口的脚本编排。',state:'Agent + 接口'}};
let mode=null,step=0,view='home',drafts={},picks={},visited={},timer;
const $=id=>document.getElementById(id);const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3300)}
function choose(m){mode=m;view='work';step=0;visited[m]=true;render()}
function nav(){ $('nav').innerHTML=`<button onclick="view='home';render()" class="${view==='home'?'active':''}">开始创作</button>`+Object.entries(modes).map(([id,m])=>`<button class="${view==='work'&&mode===id?'active':''}" onclick="choose('${id}')">${m.name}</button>`).join('')+`<hr class="divider"><button onclick="view='projects';render()">我的项目</button><button onclick="view='library';render()">风格 Skill 库</button>`;}
function styleCards(ids){return '<div class="grid">'+ids.map(id=>{const s=styles[id],rec=mode&&modes[mode].recommended.includes(id);return `<div class="card style-card ${picks[mode]===id?'selected':''}" role="button" tabindex="0" onclick="pick('${id}')" onkeydown="if(event.key==='Enter')pick('${id}')"><div class="style-thumb ${id==='clean'||id==='evidence'?'sample':''}">${s.name}</div><div class="row spread"><h3>${s.name}</h3><span class="pill ${rec?'':'amber'}">${rec?'本功能推荐':'兼容可用'}</span></div><p>${s.desc}</p><div class="sub">风格 Skill：${s.skill} · ${s.state}</div><details onclick="event.stopPropagation()"><summary>适用功能与版本</summary><p>${Object.values(modes).filter(m=>m.styles.includes(id)).map(m=>m.name).join(' / ')}。实际生产项目锁定已适配版本；升级不覆盖原项目。</p></details></div>`}).join('')+'</div>'}
function pick(id){if(view==='library'){toast('先从左侧选择制作方式，再为项目采用风格。');return}picks[mode]=id;render();toast('已选择 '+styles[id].name+'（原型内暂存）')}
function summary(){return `<div class="card summary"><span class="kicker">本次制作方案</span><h3>${modes[mode].name}</h3><dl><dt>风格 Skill</dt><dd>${picks[mode]?styles[picks[mode]].name:'尚未选择'}</dd><dt>画幅与成片</dt><dd>竖版 9:16 · MP4 + 字幕</dd><dt>声音</dt><dd>${mode==='talk'||mode==='hybrid'?'保留真人原声':'导入旁白 / 选择配音服务'}</dd><dt>费用</dt><dd>未授权任何付费任务</dd></dl><hr class="divider"><div class="sub">配音、生图、素材和剪辑分开记录。只有当前任务需要时才配置对应服务。</div></div>`}
function inputs(){return `<div class="card"><h2>${modes[mode].input}</h2><p>${mode==='footage'?'这里就是文案搜网络素材的入口，不需要先上传真人视频。':'先准备输入内容。公共素材库可复用，原文件保留。'}</p>${mode==='talk'||mode==='hybrid'?`<div class="upload">选择本地真人视频<input type="file" accept="video/*" onchange="toast('原型仅显示文件名，不读取或上传视频：'+this.files[0]?.name)"></div>`:''}<label>${mode==='talk'?'参考文稿（可选）':'主题 / 完整文案'}</label><textarea placeholder="输入本期内容；切换功能后本页草稿仍保留。" oninput="drafts[mode]=this.value">${e(drafts[mode]||'')}</textarea>${mode==='footage'||mode==='generate'?'<label>旁白来源</label><select><option>稍后选择</option><option>导入自己的录音</option><option>使用已配置的配音服务（执行前报价）</option></select>':''}<div class="row"><span class="pill">本地素材不自动上传</span><span class="sub">本原型只保留当前页面内的草稿</span></div></div>`}
function plan(){return `<div class="card"><h2>${modes[mode].steps[step]}</h2><p>这是本功能对应的方案编辑区，示例内容用于说明交互。</p>${mode==='generate'?'<label>人物 / 商品参考</label><div class="upload">从本地素材库选择，或本次导入</div><label>声音设置</label><select><option>旁白 / 数字人口播 / 不配音</option></select>':`<table><tr><th>原句 / 台词</th><th>${mode==='talk'?'剪辑建议':'画面意图'}</th><th>处理方式</th></tr><tr><td>介绍这项能力</td><td>${mode==='talk'?'保留自然表达':'展示产品真实操作过程'}</td><td>待审看</td></tr><tr><td>解释关键变化</td><td>${mode==='talk'?'校对专名与字幕':'放大重点 / 对比图表'}</td><td>待补资料</td></tr></table>`}<div class="row" style="margin-top:20px"><button onclick="toast('原型：打开本段修改意见；不会执行制作')">修改本段</button><button onclick="toast('原型：把修改意见交给 Agent')">交给 Agent 修改</button></div></div>`}
function materials(){return `<div class="card"><h2>${modes[mode].steps[step]}</h2>${mode==='generate'?'<p>每项模型、参数、真实报价与整轮上限集中在此确认。没有真实报价时显示待报价，不填零费用。</p><table><tr><th>步骤</th><th>所选服务</th><th>费用状态</th></tr><tr><td>镜头 / 配音</td><td>尚未选择</td><td>待报价</td></tr></table><label>整轮最高积分</label><input disabled placeholder="生产页面取得报价后填写；原型不收费">':mode==='talk'?'<p>查看已选择的包装片段，试听人声与配乐。配乐默认不添加。</p><div class="film">包装预览区域<small>原型占位 · 非已渲染视频</small></div>':`<p>每段台词对应素材需求、候选来源与实际选段。搜到、下载、采纳分别显示。</p><div class="row"><input style="flex:1;margin:0" placeholder="对象 + 产品版本 + 要展示的动作"><button onclick="toast('交互演示：生产版由 Agent 搜索并回填真实候选')">搜集候选素材</button><button onclick="toast('原型：导入用户自有素材')">导入本地素材</button></div><div class="source"><span class="pill amber">素材卡示例 · 未实际搜索</span><h3>官方演示视频</h3><div class="sub">来源 / 版本 / 日期 / 使用许可：待核验</div><p>对应台词：介绍具体能力。匹配理由：必须看见与台词一致的动作。</p><div class="row"><button onclick="toast('原型：播放器预览与入出点选择')">预览与选段</button><button onclick="toast('原型：替换该段素材，其他镜头保留')">替换素材</button><button onclick="toast('原型：采纳须绑定当前镜头及版本')">采纳本段</button></div></div><div class="segment"><span>旁白与人物</span><span>真实演示</span><span>说明动效</span></div>`}</div>`}
function review(){return `<div class="card"><h2>成片审看与局部修改</h2><div class="film">播放器与时间线<small>交互原型 · 无真实成片</small></div><div class="segment"><span>镜头 01</span><span>镜头 02</span><span>镜头 03</span></div><label>修改意见</label><textarea placeholder="例如：第二镜换素材；字幕小一点；保留原人声。"></textarea><div class="row"><button onclick="toast('原型：仅重做当前镜头，新增付费需重新报价')">仅修改当前片段</button><button onclick="toast('原型：播放修改前 / 修改后对比')">对比修改前后</button></div></div>`}
function render(){nav();$('toolbar').classList.add('hidden');$('crumb').textContent=view==='work'?'开始创作 / '+modes[mode].name:'工作台 / '+({home:'开始创作',library:'风格 Skill 库',projects:'我的项目',settings:'配置中心'}[view]);let h='';
if(view==='home'){h=`<div class="hero"><div class="kicker">从你已有的内容开始</div><h1>这一次，你想做哪种视频？</h1><p>先选制作方式，再选风格 Skill。所有项目、素材和交付，都在一个工作台。</p></div><div class="grid">`+Object.entries(modes).map(([id,m],i)=>`<div class="card mode-card"><div class="row spread"><span class="num">0${i+1}</span>${id==='footage'?'<span class="pill">文案搜网络视频 · 在这里</span>':''}</div><h2>${m.name}</h2><strong>${m.given}</strong><p>${m.out}</p><button class="primary" onclick="choose('${id}')">开始${m.name}</button></div>`).join('')+'</div>';}
if(view==='library'){h='<h1>风格 Skill 库</h1><p>已盘点的制作能力全部保留。可查看适用范围，一个风格允许服务多个功能。</p>'+styleCards(Object.keys(styles));}
if(view==='projects'){h='<h1>我的项目</h1><p>生产版在这里按项目恢复，显示制作方式、风格版本与待处理步骤。以下仅为本页原型内的操作记录。</p><div class="grid">'+Object.keys(visited).map(id=>`<div class="card"><h3>${modes[id].name} · 原型草稿</h3><p>${picks[id]?styles[picks[id]].name:'未选风格'} / 未执行制作</p><button onclick="choose('${id}')">继续设计预览</button></div>`).join('')+'</div>';}
if(view==='settings'){h='<h1>配置中心</h1><p>统一位置管理配置，进入任务时只显示需要的服务。不同用途的 Key 不相互代用。</p><div class="grid">'+['本机环境｜Python、FFmpeg、Node','生成服务｜92k 积分 Key','配音 / 识别｜声音服务与音色','素材来源｜搜索连接器与授权素材库'].map(t=>`<div class="card"><h3>${t}</h3><p>原型不读取真实配置，不接收密钥。</p><button onclick="toast(\'生产版提供对应配置表单，Key只进入安全存储\')">查看配置方式</button></div>`).join('')+'</div>';}
if(view==='work'){const m=modes[mode];h=`<div class="row spread"><div><span class="kicker">${m.given}</span><h1>${m.name}</h1></div><span class="pill">示例项目 · 交互设计</span></div><div class="steps">`+m.steps.map((s,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};render()">${i+1}. ${s}</button>`).join('')+`</div><div class="workspace"><section>`;const type=step===0?'input':((mode==='talk'||mode==='hybrid')&&step===1)?'plan':((mode==='talk'||mode==='hybrid')&&step===2)||(mode==='footage'&&step===1)||(mode==='generate'&&step===1)?'style':step===4?'review':step===5?'export':step===3?'materials':'plan';
h+=type==='input'?inputs():type==='style'?`<h2>选择风格 Skill</h2><p>本功能共 ${m.styles.length} 项，推荐与兼容项都能看到。选择风格不会开始制作。</p>${styleCards(m.styles)}`:type==='materials'?materials():type==='review'?review():type==='export'?'<div class="card"><h2>导出与交付</h2><p>生产版完成实际审看与确认后，输出以下文件；原型不生成下载文件。</p><ul class="stage-list"><li>成片 MP4 与字幕 SRT</li><li>原声母带 / 使用的配音</li><li>素材来源与使用范围清单</li><li>制作工程、风格版本与费用记录</li></ul><button disabled>实际完成后下载交付包</button></div>':plan();h+='</section>'+summary()+'</div>';$('toolbar').classList.remove('hidden');$('toolbar').innerHTML=`<span class="sub">草稿 / 确认方案 / 付费授权 / 最终采纳分别记录</span><div class="row"><button onclick="toast('原型草稿已保留在当前页面内，不触发制作')">保存草稿</button><button ${step===0?'disabled':''} onclick="step--;render()">上一步</button><button class="primary" onclick="${step===5?"toast('这是交互原型，未创建真实视频或授权')":"step++;render()"}">${step===5?'完成流程演示':'查看下一步'}</button></div>`;}
$('body').innerHTML=h;}
$('settings').onclick=()=>{view='settings';render()};render();
</script></html>
